volumes: { promdata: {}, grafdata: {} }
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    volumes: [ "./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "promdata:/prometheus" ]
    ports: ["127.0.0.1:9090:9090"]
    networks: [monitoring]

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes: [ "grafdata:/var/lib/grafana", "./grafana/provisioning:/etc/grafana/provisioning:ro" ]
    ports: ["127.0.0.1:3000:3000"]
    networks: [monitoring]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    volumes: [ "/:/rootfs:ro", "/var/run:/var/run:ro", "/sys:/sys:ro", "/var/lib/docker/:/var/lib/docker:ro" ]
    networks: [monitoring]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.2
    command: ["--nginx.scrape-uri=http://nginx:8082/stub_status"]
    restart: unless-stopped
    networks: [monitoring]

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    command: ["--mysqld.address=db:3306", "--mysqld.username=exporter"]
    environment: { MYSQLD_EXPORTER_PASSWORD: "${EXPORTER_PASSWORD}" }
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    networks: [monitoring, backend]
