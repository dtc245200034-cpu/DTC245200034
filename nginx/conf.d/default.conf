limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
server_tokens off;

server {                              # HTTP -> HTTPS
    listen 8080;
    return 301 https://$host$request_uri;
}
server {
    listen 8443 ssl;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; font-src https://cdn.jsdelivr.net; script-src 'self'" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    location = /metrics { return 404; }   # không lộ metrics ra ngoài
    location / {
        limit_req zone=perip burst=40 nodelay;
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
server {                              # chỉ cho exporter trong mạng nội bộ
    listen 8082;
    location /stub_status { stub_status; }
}
