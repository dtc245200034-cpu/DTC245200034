volumes: { lokidata: {} }
services:
  loki:
    image: grafana/loki:3.1.0
    command: -config.file=/etc/loki/loki.yml
    restart: unless-stopped
    volumes: [ "./loki/loki.yml:/etc/loki/loki.yml:ro", "lokidata:/loki" ]
    networks: [monitoring]

  promtail:
    image: grafana/promtail:3.1.0
    command: -config.file=/etc/promtail/promtail.yml
    restart: unless-stopped
    user: root          # cần đọc docker.sock (ghi chú trong báo cáo)
    volumes: [ "./promtail/promtail.yml:/etc/promtail/promtail.yml:ro", "/var/run/docker.sock:/var/run/docker.sock:ro" ]
    depends_on: [loki]
    networks: [monitoring]
